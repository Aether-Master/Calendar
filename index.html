<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#4F46E5">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Clarity">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="application-name" content="Clarity">
  <meta name="description" content="A calm, simple daily planner">
  <title>Clarity — Daily Planner</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="logo-192.png" type="image/png">
  <link rel="apple-touch-icon" href="logo-512.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Orbitron:wght@600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <div id="app">
    <!-- Header -->
    <header class="header">
      <div class="header-top">
        <div class="brand-left">
          <img src="logo.jpg" alt="Clarity logo" class="logo">
        </div>
        
        <h1 class="app-name">Clarity</h1>
        
        <div class="header-actions">
          <button id="themeBtn" class="icon-btn-header" aria-label="Toggle theme" title="Toggle dark/light mode">
            <svg id="themeIcon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="5"/>
              <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
            </svg>
          </button>
          <button id="todayBtn" class="text-btn" aria-label="Go to today">Today</button>
        </div>
      </div>

      <div class="clock-row">
        <div id="liveClock" class="live-clock">12:00:00</div>
      </div>

      <div class="date-nav">
        <button id="prevDay" class="nav-btn" aria-label="Previous day">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
            <path d="M15 18l-6-6 6-6"/>
          </svg>
        </button>
        <div class="current-date">
          <div id="dayName" class="day-name">Wednesday</div>
          <div id="fullDate" class="full-date">October 14, 2026</div>
          <div id="todayBadge" class="today-badge hidden">Today</div>
        </div>
        <button id="nextDay" class="nav-btn" aria-label="Next day">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
            <path d="M9 18l6-6-6-6"/>
          </svg>
        </button>
      </div>

      <div id="weekStrip" class="week-strip"></div>
    </header>

    <main class="main">
      <div id="eventsList" class="events-list"></div>

      <div id="emptyState" class="empty-state hidden">
        <div class="empty-icon">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4">
            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
            <line x1="16" y1="2" x2="16" y2="6"/>
            <line x1="8" y1="2" x2="8" y2="6"/>
            <line x1="3" y1="10" x2="21" y2="10"/>
          </svg>
        </div>
        <p>Nothing planned</p>
        <p class="empty-sub">Tap + to add something</p>
      </div>

      <!-- Future Peak: discreet upcoming events -->
      <section id="futurePeak" class="future-peak hidden">
        <div class="future-peak-header">
          <span class="future-peak-label">Future Peak</span>
          <span class="future-peak-line"></span>
        </div>
        <div id="futurePeakList" class="future-peak-list"></div>
      </section>
    </main>

    <button id="addBtn" class="fab" aria-label="Add event">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <line x1="12" y1="5" x2="12" y2="19"/>
        <line x1="5" y1="12" x2="19" y2="12"/>
      </svg>
    </button>

    <!-- Modal -->
    <div id="modal" class="modal hidden">
      <div class="modal-backdrop" id="modalBackdrop"></div>
      <div class="modal-content">
        <div class="modal-header">
          <h2 id="modalTitle">New Event</h2>
          <button id="closeModal" class="icon-btn" aria-label="Close">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="18" y1="6" x2="6" y2="18"/>
              <line x1="6" y1="6" x2="18" y2="18"/>
            </svg>
          </button>
        </div>
        <form id="eventForm">
          <div class="form-group">
            <label for="eventTitle">Title</label>
            <input type="text" id="eventTitle" placeholder="What do you need to do?" required autocomplete="off" enterkeyhint="done">
          </div>
          
          <div class="form-row">
            <div class="form-group">
              <label for="eventTime">Time</label>
              <input type="time" id="eventTime">
            </div>
            <div class="form-group checkbox-group">
              <label class="checkbox-label">
                <input type="checkbox" id="allDay">
                <span>All day</span>
              </label>
            </div>
          </div>
          
          <div class="form-group">
            <label for="recurrence">Repeat</label>
            <select id="recurrence">
              <option value="none">Does not repeat</option>
              <option value="daily">Daily</option>
              <option value="monthly">Monthly</option>
            </select>
          </div>
          
          <div class="form-group">
            <label for="eventNote">Note <span class="optional">(optional)</span></label>
            <textarea id="eventNote" rows="2" placeholder="Any extra details..."></textarea>
          </div>
          
          <div class="form-actions">
            <button type="button" id="deleteBtn" class="btn btn-danger hidden">Delete</button>
            <button type="submit" class="btn btn-primary">Save</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("./sw.js", { updateViaCache: "none" })
        .then((reg) => {
          reg.update().catch(() => {});
          let refreshing = false;
          navigator.serviceWorker.addEventListener("controllerchange", () => {
            if (refreshing) return;
            refreshing = true;
            window.location.reload();
          });
        })
        .catch(console.error);

      document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === "visible" && navigator.serviceWorker.controller) {
          navigator.serviceWorker.getRegistration().then((reg) => reg && reg.update());
        }
      });
    }
  </script>
</body>
</html>
